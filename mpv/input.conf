# ==============================================================================
# Audio Track
# ==============================================================================
_           ignore                                          #menu: Audio Track > Tracks #@tracks/audio
_           script-message-to dialog open add-audio         #menu: Audio Track > Add Audio Track... #@state=(idle_active and 'disabled')
_           ignore                                          #menu: Audio Track > -
a           osd-msg cycle audio                             #menu: Audio Track > Next Audio Track
_           ignore                                          #menu: Audio Track > -
Ctrl+d      osd-msg add audio-delay 0.1                     #menu: Audio Track > Audio Delay +0.1s
Ctrl+D      osd-msg add audio-delay -0.1                    #menu: Audio Track > Audio Delay -0.1s
_           ignore                                          #menu: Audio Track > -

# Audio Boost & Dialogue Clarity (MPC-HC Style Normalizer & Voice Clarity)
n           script-binding audio_boost/cycle-audio-boost    #menu: Audio Track > Audio Boost & Dialogue > Cycle Audio Boost Modes (N / Ctrl+B)
_           ignore                                          #menu: Audio Track > Audio Boost & Dialogue > -
_           script-message-to audio_boost set-audio-boost dialogue #menu: Audio Track > Audio Boost & Dialogue > Dialogue Clarity (Speech Boost / Clear Voice) #@state=(user_data_audio_boost_mode == 'dialogue' and 'checked')
_           script-message-to audio_boost set-audio-boost mpc #menu: Audio Track > Audio Boost & Dialogue > MPC-HC Normalizer (400% Max Boost) #@state=(user_data_audio_boost_mode == 'mpc' and 'checked')
_           script-message-to audio_boost set-audio-boost high #menu: Audio Track > Audio Boost & Dialogue > High Speech & Volume Boost #@state=(user_data_audio_boost_mode == 'high' and 'checked')
_           script-message-to audio_boost set-audio-boost night #menu: Audio Track > Audio Boost & Dialogue > Night Mode (Reduce Loud Effects, Boost Whispers) #@state=(user_data_audio_boost_mode == 'night' and 'checked')
_           ignore                                          #menu: Audio Track > Audio Boost & Dialogue > -
_           script-message-to audio_boost set-audio-boost off #menu: Audio Track > Audio Boost & Dialogue > Turn Off Audio Boost (Original Sound) #@state=((not user_data_audio_boost_mode or user_data_audio_boost_mode == 'off') and 'checked')
_           ignore                                          #menu: Audio Track > -

_           ignore                                          #menu: Audio Track > Audio Output Devices #@audio-devices
_           ignore                                          #menu: Audio Track > Graphic Equalizer > -
_           script-message-to firequalizer15 set-preset flat #menu: Audio Track > Graphic Equalizer > Off / Flat (No Equalizer) #@state=(user_data_firequalizer15_preset == 'flat' and 'checked')
_           script-message-to firequalizer15 set-preset bass #menu: Audio Track > Graphic Equalizer > Bass Boost #@state=(user_data_firequalizer15_preset == 'bass' and 'checked')
_           script-message-to firequalizer15 set-preset vocal #menu: Audio Track > Graphic Equalizer > Vocal / Dialogue Clarity #@state=(user_data_firequalizer15_preset == 'vocal' and 'checked')
_           script-message-to firequalizer15 set-preset treble #menu: Audio Track > Graphic Equalizer > Treble Boost #@state=(user_data_firequalizer15_preset == 'treble' and 'checked')
_           script-message-to firequalizer15 set-preset rock #menu: Audio Track > Graphic Equalizer > Dynamic (Rock / Pop) #@state=(user_data_firequalizer15_preset == 'rock' and 'checked')
_           ignore                                          #menu: Audio Track > Graphic Equalizer > -
