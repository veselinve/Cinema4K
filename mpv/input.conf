# ==============================================================================
# MPV-Made-Easy - Input Configuration & MPC-HC / K-Lite Style Context Menu
# ==============================================================================

# ==============================================================================
# Mouse & Context Menu Bindings
# ============================================================================== #
MBTN_LEFT       cycle pause
MBTN_LEFT_DBL   cycle fullscreen; set pause no                  # Double-click: fullscreen without leaving the video paused
MBTN_RIGHT      script-binding dyn_menu/toggle
MBTN_RIGHT_DBL  ignore
MENU            script-binding dyn_menu/toggle
Shift+F10       script-binding dyn_menu/toggle

# ==============================================================================
# File Menu
# ==============================================================================
Ctrl+o      script-message-to dialog open                   #menu: File > Open File...
Ctrl+O      script-message-to dialog open-folder            #menu: File > Open Folder...
Ctrl+v      script-message-to dialog open-clipboard         #menu: File > Open URL / Clipboard
_           script-message-to dialog open append            #menu: File > Add To Playlist...
_           ignore                                          #menu: File > -
_           script-message-to dialog open bd-iso            #menu: File > Open Blu-ray ISO / Folder...
_           script-message-to dialog open dvd-iso           #menu: File > Open DVD ISO / Folder...
_           ignore                                          #menu: File > -
_           script-message-to dialog save screenshot        #menu: File > Save Screenshot File...
_           script-message-to dialog save playlist          #menu: File > Save Playlist File...
_           script-message-to dialog set-clipboard ${path}  #menu: File > Copy File Path
_           script-message-to dialog set-clipboard ${filename} #menu: File > Copy File Name
_           ignore                                          #menu: File > -
_           stop                                            #menu: File > Close File #@state=(idle_active and 'disabled')
Alt+x       quit                                            #menu: File > Exit

# ==============================================================================
# Playback Controls
# ==============================================================================
Space       cycle pause                                     #menu: Play / Pause #@state=(pause and 'checked')
.           stop                                            #menu: Stop #@state=(idle_active and 'disabled')
_           ignore                                          #menu: -

# ==============================================================================
# Repeat
# ==============================================================================
L           cycle-values loop-file inf no                   #menu: Repeat > Repeat File (Infinite) #@state=(loop_file and 'checked')
_           cycle-values loop-playlist inf no               #menu: Repeat > Repeat Playlist #@state=(loop_playlist and 'checked')
l           ab-loop                                         #menu: Repeat > A-B Loop (Set / Clear)
_           set loop-file no; set loop-playlist no          #menu: Repeat > Repeat Off

# ==============================================================================
# Playback Rate / Speed
# ==============================================================================
]           multiply speed 1.1                              #menu: Playback Rate > Increase (+10%)
[           multiply speed 1/1.1                            #menu: Playback Rate > Decrease (-10%)
_           ignore                                          #menu: Playback Rate > -
}           multiply speed 2.0                              #menu: Playback Rate > Double Speed (2.0x)
{           multiply speed 0.5                              #menu: Playback Rate > Half Speed (0.5x)
_           ignore                                          #menu: Playback Rate > -
_           set speed 0.5                                   #menu: Playback Rate > 0.5x
_           set speed 0.75                                  #menu: Playback Rate > 0.75x
BS          set speed 1.0                                   #menu: Playback Rate > 1.0x (Normal)
_           set speed 1.25                                  #menu: Playback Rate > 1.25x
_           set speed 1.5                                   #menu: Playback Rate > 1.5x
_           set speed 2.0                                   #menu: Playback Rate > 2.0x
_           set speed 3.0                                   #menu: Playback Rate > 3.0x
_           ignore                                          #menu: Playback Rate > -
_           set speed 1.0                                   #menu: Playback Rate > Reset Rate (1.0x)

# ==============================================================================
# Full Screen & Zoom
# ==============================================================================
F11         cycle fullscreen                                #menu: Full Screen (F11 / Enter / F) #@state=(fullscreen and 'checked')
f           cycle fullscreen
F           cycle fullscreen
Enter       cycle fullscreen
Alt+Enter   cycle fullscreen
ESC         set fullscreen no

Alt+0       set window-scale 0.5                            #menu: Zoom > 50 %
Alt+1       set window-scale 1.0                            #menu: Zoom > 100 % (Original)
Alt+2       set window-scale 2.0                            #menu: Zoom > 200 %
Alt+3       set window-scale 3.0                            #menu: Zoom > 300 %
_           ignore                                          #menu: Zoom > -
Alt++       add window-scale 0.1                            #menu: Zoom > Zoom In (Enlarge)
Alt+-       add window-scale -0.1                           #menu: Zoom > Zoom Out (Shrink)
_           set window-scale 1.0; set autofit-larger "90%x80%" #menu: Zoom > Auto Fit Window

# ==============================================================================
# Video Frame / Aspect Ratio
# ==============================================================================
_           set video-aspect-override -1                    #menu: Video Frame > Keep Aspect Ratio (Default)
_           set video-aspect-override 16:9                  #menu: Video Frame > 16:9
_           set video-aspect-override 4:3                   #menu: Video Frame > 4:3
_           set video-aspect-override 2.35:1                #menu: Video Frame > 2.35:1
_           set video-aspect-override 21:9                  #menu: Video Frame > 21:9
_           ignore                                          #menu: Video Frame > -
Ctrl+r      cycle-values video-rotate 90 180 270 0          #menu: Video Frame > Rotate 90В° Clockwise
_           cycle-values video-rotate 270 180 90 0          #menu: Video Frame > Rotate 90В° Counter-Clockwise
_           cycle-values vf "hflip" ""                      #menu: Video Frame > Flip Horizontally
_           cycle-values vf "vflip" ""                      #menu: Video Frame > Flip Vertically

# ==============================================================================
# Pan & Scan (PnS Frame Adjust)
# ==============================================================================
Ctrl++      add video-zoom 0.1                              #menu: PnS Frame Adjust > Increase Size (Zoom In)
Ctrl+-      add video-zoom -0.1                             #menu: PnS Frame Adjust > Decrease Size (Zoom Out)
_           ignore                                          #menu: PnS Frame Adjust > -
Ctrl+Left   add video-pan-x -0.01                           #menu: PnS Frame Adjust > Move Left
Ctrl+Right  add video-pan-x 0.01                            #menu: PnS Frame Adjust > Move Right
Ctrl+Up     add video-pan-y -0.01                           #menu: PnS Frame Adjust > Move Up
Ctrl+Down   add video-pan-y 0.01                            #menu: PnS Frame Adjust > Move Down
_           ignore                                          #menu: PnS Frame Adjust > -
_           add panscan -0.1                                #menu: PnS Frame Adjust > Decrease Height
_           add panscan 0.1                                 #menu: PnS Frame Adjust > Increase Height
_           ignore                                          #menu: PnS Frame Adjust > -
Ctrl+BS     set video-zoom 0; set video-pan-x 0; set video-pan-y 0 #menu: PnS Frame Adjust > Reset Pan & Scan

# ==============================================================================
# Navigate
# ==============================================================================
Ctrl+g      script-binding seek_to/toggle-seeker         #menu: Navigate > Jump To Time... (Go To)
_           ignore                                          #menu: Navigate > -
>           playlist-next                                   #menu: Navigate > Next File
<           playlist-prev                                   #menu: Navigate > Previous File
_           ignore                                          #menu: Navigate > -
PGUP        add chapter 1                                   #menu: Navigate > Next Chapter
PGDWN       add chapter -1                                  #menu: Navigate > Previous Chapter
_           ignore                                          #menu: Navigate > -
_           frame-step                                      #menu: Navigate > Jump Next Frame
_           frame-back-step                                 #menu: Navigate > Jump Previous Frame
,           osd-msg frame-back-step ; show-text "Frame: ${estimated-frame-number} / ${estimated-frame-count}"
.           osd-msg frame-step ; show-text "Frame: ${estimated-frame-number} / ${estimated-frame-count}"
_           ignore                                          #menu: Navigate > -
Right       osd-msg seek 5                                  #menu: Navigate > Jump 5 sec forward
Left        osd-msg seek -5                                 #menu: Navigate > Jump 5 sec backward
Shift+Right osd-msg seek 1 exact                            #menu: Navigate > Jump 1 sec forward
Shift+Left  osd-msg seek -1 exact                           #menu: Navigate > Jump 1 sec backward
Ctrl+Right  osd-msg seek 30                                 #menu: Navigate > Jump 30 sec forward
Ctrl+Left   osd-msg seek -30                                #menu: Navigate > Jump 30 sec backward
_           osd-msg seek 60                                 #menu: Navigate > Jump 1 min forward
_           osd-msg seek -60                                #menu: Navigate > Jump 1 min backward
Ctrl+Right  osd-msg seek 300                                #menu: Navigate > Jump 5 min forward
Ctrl+Left   osd-msg seek -300                               #menu: Navigate > Jump 5 min backward
_           ignore                                          #menu: Navigate > -
_           ignore                                          #menu: Navigate > Chapters #@chapters
_           ignore                                          #menu: Navigate > Playlist #@playlist
_           ignore                                          #menu: Navigate > Editions #@editions

# ==============================================================================
# Favorites & Playlist
# ==============================================================================
Ctrl+p      script-binding playlistmanager/showplaylist     #menu: Favorites > Open Playlist Manager
p           script-binding playlistmanager/peek_at_playlist #menu: Favorites > Peek Current Playlist
_           playlist-shuffle                                #menu: Favorites > Shuffle Playlist
_           playlist-clear                                  #menu: Favorites > Clear Playlist

# ==============================================================================
# Filters & Processing
# ==============================================================================
D           cycle deband                                    #menu: Filters > Toggle Debanding #@state=(deband and 'checked')
d           cycle deinterlace                               #menu: Filters > Toggle Deinterlacing #@state=(deinterlace and 'checked')
Ctrl+h      cycle-values hwdec auto-safe no                 #menu: Filters > Toggle Hardware Decoding #@state=(hwdec_current ~= 'no' and 'checked')
_           cycle icc-profile-auto                          #menu: Filters > Toggle Auto ICC Profile #@state=(icc_profile_auto and 'checked')

# ==============================================================================
# Color Controls
# ==============================================================================
_           add brightness 1                                #menu: Color controls... > Brightness +1
_           add brightness -1                               #menu: Color controls... > Brightness -1
_           ignore                                          #menu: Color controls... > -
_           add contrast 1                                  #menu: Color controls... > Contrast +1
_           add contrast -1                                 #menu: Color controls... > Contrast -1
_           ignore                                          #menu: Color controls... > -
_           add gamma 1                                     #menu: Color controls... > Gamma +1
_           add gamma -1                                    #menu: Color controls... > Gamma -1
_           ignore                                          #menu: Color controls... > -
_           add saturation 1                                #menu: Color controls... > Saturation +1
_           add saturation -1                               #menu: Color controls... > Saturation -1
_           ignore                                          #menu: Color controls... > -
_           set brightness 0; set contrast 0; set gamma 0; set saturation 0; show-text "Color settings reset" #menu: Color controls... > Reset All Color Controls

# ==============================================================================
# Shaders: Cinema4K (Films / Real-Life) & Anime4K (Anime / Animation)
# ==============================================================================
F7          no-osd change-list glsl-shaders clr ""; show-text "Shaders OFF" 2000 #menu: Shaders > Clear All Shaders (OFF) (F7 / Ctrl+0) #@state=((not glsl_shaders or glsl_shaders == '') and 'checked')
Ctrl+0      no-osd change-list glsl-shaders clr ""; show-text "Shaders OFF" 2000
_           ignore                                          #menu: Shaders > -

