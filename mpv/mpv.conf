input-ipc-server=\\.\pipe\mpvsocket	# Used for HexChat 


############################
# Quality related settings #
############################

profile=gpu-hq

# Hardware decoding for modern AMD / NVIDIA GPUs (AV1, HEVC, H264 hardware acceleration)
hwdec=auto-safe

# Video driver to use. Modern libplacebo gpu-next engine.
vo=gpu-next

###### DirectX on Windows (recommended for AMD RX 7800 XT)
gpu-api=d3d11
fbo-format=rgba16hf

# Cinema4K Studio Master Engine Active by Default (Press F7 to turn OFF, F4/F5/F6 to switch modes)
# glsl-shaders="" # Shaders OFF by default (use F5 for Cinema4K or Ctrl+1..6 for Anime4K)

###### High-Quality Scalers (Crisp, sharp, no softening)
scale=ewa_lanczos
dscale=spline36
cscale=spline36
scale-antiring=0
dscale-antiring=0
cscale-antiring=0
sigmoid-upscaling=no
correct-downscaling=yes
linear-downscaling=no

###### Debanding (Disabled by default to preserve crystal sharp film grain and textures)
deband=no
deband-iterations=2
deband-threshold=24
deband-range=16
deband-grain=12

#############
# OSD / OSC # 
#############
# Use the below if you're NOT using Taiga (duration causes list updating to not function and slowness)
#title=${media-title} [${time-pos}${!duration==0: - ${duration}}] • ${frame-drop-count} dropped frames - ${mpv-version} #Note: a "/" breaks Taiga detection where it only reads the contents AFTER the "/"

# Use this if using Taiga
#title=${media-title} • ${frame-drop-count} dropped frames - ${mpv-version} #Note: a "/" breaks Taiga detection where it only reads the contents AFTER the "/" #Note 2: will fallback to filename if media-title isnt set
title=${filename} • ${frame-drop-count} dropped frames - ${mpv-version} #Note: a "/" breaks Taiga detection where it only reads the contents AFTER the "/"

autofit-larger=90%x80%
#window-maximized=yes					# Maximise window when opening MPV 
window-minimized=no						# Prevent MPV opening minimised
#ontop									# Disabled by default so MPV does not stay on top of other windows. Toggle with Ctrl+T
no-ontop
volume-max=200							# Allow volume boost up to 200%
osc=no									# Do not remove/comment if mpv_thumbnail_script_client_osc.lua is being used.
osd-bar=no								# Disable the primitive white progress bar at top of screen
osd-on-seek=msg							# Show time and duration text message on seek
osd-font='Source Sans Variable Roman'	# Readable font for text messages, timestamps, and volume numbers
osd-font-size=28						# Clean and readable OSD font size
osd-color='#FFFFFFFF'                   # Crisp white text
osd-border-color='#FF000000'            # Solid black outline for maximum readability
osd-border-size=2                       # Clear border outline
osd-shadow-offset=1						# Subtle shadow
osd-bold=yes							# Make text bold
osd-duration=1500						# Display duration in ms
cursor-autohide=2000					# Autohide mouse cursor after 2 seconds of inactivity
cursor-autohide-fs-only=no				# Autohide cursor in both windowed and fullscreen modes
save-position-on-quit=yes				# Remember position of playback for each file
watch-later-directory=~~/watch_later	# Save position files in config watch_later folder
write-filename-in-watch-later-config=yes # Include filename comment in watch later files
watch-later-options=start,sub-pos,sub-scale,secondary-sub-pos # Remember position and subtitle adjustments
#keep-open=always						# Pause file and dont close player at end of playback

#############
# Subtitles #
#############

slang=bul,bg,Bulgarian,eng,en,English,spa,es,Spanish,fre,fra,fr,French,ger,deu,de,German,ita,it,Italian,rus,ru,Russian,jpn,ja,Japanese,por,pt,Portuguese,tur,tr,Turkish,pol,pl,Polish,ell,el,Greek,ara,ar,Arabic,kor,ko,Korean,zho,chi,zh,Chinese	# Priority subtitle language order
sub-codepage=auto                      # Auto-detect encoding with uchardet (Windows-1251 CP1251, UTF-8, UTF-16)
sub-ass-use-video-data=all		# Backward compatibility for vsfilter fansubs
sub-ass-scale-with-window=no			# May have undesired effects with signs being misplaced. 
sub-auto=fuzzy                          # external subs don't have to match the file name exactly to autoload
sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles
sub-file-paths-append=Subs
sub-file-paths-append=Subtitles
sub-file-paths-append=Sub
sub-file-paths-append=sub-files
sub-file-paths-append=Bulgarian
sub-file-paths-append=bulgarian
sub-file-paths-append=BG
sub-file-paths-append=bg
sub-file-paths-append=English
sub-file-paths-append=english
sub-file-paths-append=Subs/Bulgarian
sub-file-paths-append=Subs/bulgarian
sub-file-paths-append=Subs/BG
sub-file-paths-append=Subs/bg
sub-file-paths-append=Subs/English
sub-file-paths-append=Subs/english
sub-file-paths-append=Subtitles/Bulgarian
sub-file-paths-append=Subtitles/English
demuxer-mkv-subtitle-preroll            # try to correctly show embedded subs when seeking
embeddedfonts=yes						# use embedded fonts for SSA/ASS subs
sub-fix-timing=no                       # do not try to fix gaps (which might make it worse in some cases). Enable if there are scenebleeds.
#sub-ass-force-style=Kerning=yes        # NO NOT ENABLE THIS unless you have to. Causes placement of signs that fade in/out with '\t' and 'alpha' tags to "shuffle" on screen. I.e Just no unless you have to. Allows you to override style parameters of ASS scripts
sub-use-margins
sub-ass-force-margins
#sub-ass-override=force					# Override all subtitle styling. May be useful in the [Profile] section


#######################
# Screenshot settings #
#######################

screenshot-format=png					# Set screenshot format
screenshot-png-compression=0			# Range is 0 to 9. 0 being no compression.
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes			# Note this produces a huge file size and a 48 bit-depth image. Setting this to "no" outputs a 24 bit-depth image with a sane filesize. 
screenshot-template="%x\Screens\Screenshot-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}"

#######################
# Youtube-dl settings #
#######################
#ytdl-format=bestaudio					#Un-comment this if you want NO video playback when streaming youtube links.
#ytdl-format=bestvideo[height<=1080]+bestaudio #Uncomment if you want 1080p Youtube videos

##############################################################################
# Built-in Context Menu & Select Configuration                               #
# (Completely disabled so only our unified MPC-HC dyn_menu is used)          #
##############################################################################
load-context-menu=no
load-select=no
